<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Log In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/style.css" />
    <script type="module" src="./src/login.js" defer></script>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>

  <div id="modal" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true">
      <button id ="modal-back" class ="modal-back" aria-label="Retour"></button>
      <button id="modal-close" class="modal-close" aria-label="Fermer"></button>

      <!-- Vue 1 : liste des travaux -->
      <div id="modal-gallery-view">
        <h3>Galerie photo</h3>
        <div id="modal-gallery" class="modal-gallery"></div>
        <button id="modal-add" class="modal-add">Ajouter une photo</button>
      </div>
    </div>

     <!-- Vue 2 : formulaire d'ajout de photo -->
      <div id="modal-form-view" hidden>
        <h3>Ajout photo</h3>
        <form id="add-work-form">
          <input type="file" id="work-image" accept="image.png, image/jpeg"/>
          <label for="work-title">Titre</label>
          <input type="text" id="work-title" />
          <label for="work-category">Catégorie</label>
          <select id="work-category"></select>
          <button type="submit">Valider</button>
        </form>
      </div>
  </div>
  </div>

  <body>
    <header>
      <h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
      <nav>
        <ul>
          <li>projets</li>
          <li>contact</li>
          <li>login</li>
          <li><img src="./assets/icons/instagram.png" alt="Instagram" /></li>
        </ul>
      </nav>
    </header>
    <main id="login">
      <h1>Log in</h1>

      <form id="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>

        <div class="login-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" />
        </div>

        <p id="login-error" class="login-error"></p>

        <button type="submit">Se connecter</button>

        <a href="#">Mot de passe oublié ?</a>
      </form>
    </main>
  </body>
</html>
